name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/release.js validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/release
      - name: Verify all archives and render the Homebrew formula
        run: |
          node scripts/release.js formula
          ruby -c dist/release/promptly.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/release/promptly.rb
          if-no-files-found: error
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > dist/release/notes.md <<'EOF'
          A standalone generator for procedural zsh prompt art. No Node or Bun installation required.

          Install: `brew install yungibly/tap/promptly`

          Generate: `promptly` · Copy: `promptly | pbcopy` · Try in zsh: `source <(promptly)`

          Preview: `promptly --preview` · Explore: `promptly gallery --complexity 8`

          macOS and Linux downloads are provided for ARM64 and x86-64. Extract an archive and put `promptly` on your PATH. `SHA256SUMS` contains the archive checksums. Previews and generated prompts require zsh 5.8+.
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Promptly $RELEASE_TAG" --notes-file dist/release/notes.md
          fi
          # A rerun may finish a draft, but never replace published binaries.
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$RELEASE_TAG" dist/release/*.tar.gz dist/release/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            mkdir -p dist/published
            gh release download "$RELEASE_TAG" --dir dist/published
            for asset in dist/release/*.tar.gz dist/release/SHA256SUMS; do
              cmp "$asset" "dist/published/$(basename "$asset")"
            done
          fi

  homebrew-test:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - name: Make Homebrew available on Linux
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install from the published archive and test
        run: |
          tap="$(brew --repository)/Library/Taps/yungibly/homebrew-release-test"
          mkdir -p "$tap/Formula"
          git -C "$tap" init --quiet
          cp formula/promptly.rb "$tap/Formula/promptly.rb"
          brew install yungibly/release-test/promptly
          brew test yungibly/release-test/promptly
          promptly --version

  update-tap:
    needs: homebrew-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yungibly/homebrew-tap
          token: ${{ secrets.BREW_TAP_TOKEN }}
          ref: main
          path: tap
      - name: Commit formula update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp formula/promptly.rb tap/Formula/promptly.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/promptly.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "promptly $RELEASE_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
